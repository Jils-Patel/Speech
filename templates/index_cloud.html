<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .app-header {
            background: linear-gradient(135deg, #78BE20 0%, #5C9A1B 100%);
            padding: 20px 40px;
            color: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            z-index: 10;
            position: relative;
            flex-shrink: 0;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .app-title {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: 30px;
        }
        
        .app-title h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
        }
        
        .app-title p {
            opacity: 0.9;
            font-size: 16px;
            margin: 0;
        }
        
        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-right: 30px;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            min-height: calc(100vh - 80px);
        }
        
        .conversation-section {
            background: white;
            margin: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 50vh;
            min-height: 500px;
        }
        
        .conversation-header {
            background: #fafafa;
            padding: 20px 30px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .status-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            color: #333;
            font-size: 15px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
        }
        
        .status.ready .status-indicator {
            background: #78BE20;
            animation: pulse 2s infinite;
        }
        
        .status.listening .status-indicator {
            background: #ff4757;
            animation: pulse 1s infinite;
        }
        
        .status.processing .status-indicator {
            background: #ffa502;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        .audio-visualizer {
            background: linear-gradient(135deg, #78BE20, #5C9A1B);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 200px;
            justify-content: center;
        }
        
        .recording-animation {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        
        .conversation-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: #fafafa;
            position: relative;
        }
        
        .conversation-area::-webkit-scrollbar {
            width: 6px;
        }
        
        .conversation-area::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        .conversation-area::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        
        .conversation-area::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        .message {
            margin-bottom: 25px;
            display: flex;
            animation: slideIn 0.5s ease-out;
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.agent {
            justify-content: flex-start;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 18px 24px;
            border-radius: 24px;
            font-size: 15px;
            line-height: 1.6;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .message.user .message-bubble {
            background: linear-gradient(135deg, #78BE20, #5C9A1B);
            color: white;
            border-bottom-right-radius: 8px;
        }
        
        .message.agent .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 8px;
        }
        
        .message-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin: 0 15px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .message.user .message-avatar {
            background: linear-gradient(135deg, #5C9A1B, #4A7C16);
            color: white;
            order: 2;
        }
        
        .message.agent .message-avatar {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            color: #666;
        }
        
        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 6px;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .empty-state {
            text-align: center;
            color: #9ca3af;
            font-style: italic;
            padding: 60px 20px;
            font-size: 16px;
        }
        
        .empty-state::before {
            content: "💬";
            display: block;
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .member-selection-section {
            background: white;
            margin: 0 20px 20px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 40vh;
            min-height: 350px;
        }
        
        .member-selection-header {
            background: #fafafa;
            padding: 20px 30px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .member-selection-header h3 {
            margin: 0;
            color: #333;
            font-size: 18px;
            font-weight: 600;
        }
        
        .selected-member-info {
            background: linear-gradient(135deg, #e8f5e8, #f0f8e8);
            border: 1px solid #78BE20;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            color: #2d5016;
            display: none;
        }
        
        .selected-member-info.show {
            display: block;
        }
        
        .members-container {
            flex: 1;
            overflow-y: auto;
        }
        
        .members-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .members-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        .members-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        
        .members-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .members-table th {
            background: #f8f9fa;
            padding: 16px 24px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
            font-size: 14px;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        
        .member-row {
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid #f3f4f6;
        }
        
        .member-row:hover {
            background: linear-gradient(135deg, #f0f8e8, #e8f5e8);
        }
        
        .member-row.selected {
            background: linear-gradient(135deg, #e8f5e8, #d4f0d4);
            border-left: 4px solid #78BE20;
        }
        
        .member-row td {
            padding: 16px 24px;
            font-size: 14px;
            color: #374151;
        }
        
        .member-name-cell {
            font-weight: 600;
            color: #1f2937;
        }
        
        .member-id-cell {
            color: #9ca3af;
        }
        
        .member-dob-cell {
            color: #9ca3af;
        }
        
        .btn {
            background: white;
            color: #2d5016;
            border: 2px solid white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }
        
        .btn:hover {
            background: #f8f9fa;
            color: #1f2937;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            background: rgba(255, 255, 255, 0.5);
            color: rgba(45, 80, 22, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .error {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #dc2626;
            padding: 16px 24px;
            border-radius: 12px;
            margin: 20px;
            border: 1px solid #f87171;
            display: none;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.1);
        }
        
        .permission-request {
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            color: #1d4ed8;
            padding: 16px 24px;
            border-radius: 12px;
            margin: 20px;
            text-align: center;
            border: 1px solid #60a5fa;
            display: none;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.1);
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 0;
        }
        
        .typing-dot {
            width: 6px;
            height: 6px;
            background: #9ca3af;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .app-header {
                padding: 15px 20px;
            }
            
            .header-content {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .app-title h1 {
                font-size: 24px;
            }
            
            .main-content {
                margin: 0;
                height: calc(100vh - 120px);
            }
            
            .conversation-section,
            .member-selection-section {
                margin: 10px;
                border-radius: 12px;
            }
            
            .conversation-header,
            .member-selection-header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            
            .header-controls {
                flex-direction: column;
                width: 100%;
                gap: 10px;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
            
            .message-bubble {
                max-width: 85%;
                font-size: 14px;
                padding: 16px 20px;
            }
            
            .conversation-area {
                padding: 20px;
            }
            
            .members-table th,
            .member-row td {
                padding: 12px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <div class="header-content">
            <div class="app-title">
                <div>
                    <h1>Harmony</h1>
                    <p>A Humana Digital Care Manager Assistant</p>
                </div>
            </div>
            <div class="header-controls">
                <button id="startBtn" class="btn" onclick="startConversation()" disabled>
                    <span>▶</span> Start Assessment
                </button>
                <button id="stopBtn" class="btn btn-secondary" onclick="stopConversation()" disabled>
                    <span>⏹</span> Stop Assessment
                </button>
                <button id="downloadBtn" class="btn btn-secondary" onclick="downloadTranscript()" style="display: none;">
                    <span>📥</span> Download Transcript
                </button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="conversation-section">
            <div class="conversation-header">
                <div class="status-section">
                    <div id="status" class="status ready">
                        <div class="status-indicator"></div>
                        <span>Ready to begin your health assessment</span>
                    </div>
                </div>
                <div class="audio-visualizer" id="audioVisualizer">
                    Select a member to begin
                </div>
            </div>
            
            <div class="conversation-area" id="conversationArea">
                <div class="empty-state">
                    Start a conversation to see messages here
                </div>
            </div>
        </div>

        <div class="member-selection-section">
            <div class="member-selection-header">
                <div class="selected-member-info" id="selectedMemberInfo">
                    <strong>Selected:</strong> <span id="selectedMemberName"></span>
                    <br><small>ID: <span id="selectedMemberId"></span></small>
                </div>
            </div>
            <div class="members-container">
                <table class="members-table" id="membersTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>ID</th>
                            <th>DOB</th>
                            <th>Email</th>
                            <th>Last4SSN</th>
                        </tr>
                    </thead>
                    <tbody id="membersTableBody">
                        <!-- Members will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="permissionRequest" class="permission-request">
        <strong>🎤 Microphone Access Required</strong><br>
        Please allow microphone access to continue.
    </div>
    
    <div id="error" class="error"></div>

    <script>
        // Global variables
        let socket = null;
        let mediaRecorder = null;
        let audioStream = null;
        let isRecording = false;
        let isConversationActive = false;
        let currentAudio = null;
        let conversationTranscript = [];
        let messageCount = 0;
        let selectedMember = null;
        let membersData = [];
        
        // Initialize Socket.IO connection
        function initializeSocket() {
            socket = io();
            
            socket.on('connect', function() {
                console.log('Connected to server');
                updateStatus('Connected to server', 'ready');
            });
            
            socket.on('disconnect', function() {
                console.log('Disconnected from server');
                updateStatus('Disconnected from server', '');
            });
            
            socket.on('conversation_started', function(data) {
                console.log('Conversation started:', data);
                updateStatus('Assessment started - Listening for your voice...', 'ready');
                isConversationActive = true;
                messageCount = 0;
                conversationTranscript = [];
                clearConversation();
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('downloadBtn').style.display = 'inline-flex';
                
                // Start listening immediately after conversation starts
                setTimeout(() => {
                    if (isConversationActive) {
                        startListening();
                    }
                }, 500);
            });
            
            socket.on('transcription_result', function(data) {
                if (data.text && data.text.trim()) {
                    console.log('Transcription:', data.text, 'Confidence:', data.confidence);
                    updateStatus(`Processing response...`, 'processing');
                    addUserMessage(data.text);
                    conversationTranscript.push({
                        type: 'user',
                        text: data.text,
                        timestamp: new Date().toLocaleTimeString()
                    });
                }
            });
            
            socket.on('agent_response', function(data) {
                console.log('Agent response:', data.text);
                updateStatus('Harmony is responding...', 'processing');
                
                // Show typing indicator briefly
                showTypingIndicator();
                
                setTimeout(() => {
                    addAgentMessage(data.text);
                    conversationTranscript.push({
                        type: 'agent',
                        text: data.text,
                        timestamp: new Date().toLocaleTimeString()
                    });
                    
                    // Play TTS audio
                    playTTSAudio(data.audio, function() {
                        // After audio finishes, give user time to prepare response
                        if (isConversationActive) {
                            updateStatus('Please prepare your response...', 'ready');
                            setTimeout(() => {
                                if (isConversationActive) {
                                    startListening();
                                }
                            }, 1000); // 2 second delay before starting to listen
                        }
                    });
                }, 1000);
            });
            
            socket.on('processing_audio', function(data) {
                updateStatus(data.status, 'processing');
            });
            
            socket.on('conversation_ended', function(data) {
                console.log('Conversation ended');
                isConversationActive = false;
                stopListening();
                updateStatus('Health assessment completed', 'ready');
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            });
            
            socket.on('conversation_should_end', function(data) {
                console.log('Conversation should end:', data.reason);
                setTimeout(() => stopConversation(), 2000);
            });
            
            socket.on('error', function(data) {
                console.error('Server error:', data.message);
                showError(data.message);
                if (isRecording) {
                    stopListening();
                }
            });
            
            socket.on('member_selected', function(data) {
                console.log('Member selected on server:', data.member);
                updateStatus(data.message, 'ready');
            });
        }
        
        // Initialize microphone access
        async function initializeMicrophone() {
            try {
                document.getElementById('permissionRequest').style.display = 'block';
                
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                document.getElementById('permissionRequest').style.display = 'none';
                updateStatus('Microphone ready', 'ready');
                return true;
                
            } catch (error) {
                console.error('Microphone access denied:', error);
                showError('Microphone access is required for voice assessment. Please allow microphone access and refresh the page.');
                return false;
            }
        }
        
        // Start conversation
        async function startConversation() {
            // Check if member is selected
            if (!selectedMember) {
                showError('Please select a member before starting the assessment.');
                return;
            }
            
            if (!socket) {
                initializeSocket();
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            const micAllowed = await initializeMicrophone();
            if (!micAllowed) return;
            
            socket.emit('start_conversation');
        }
        
        // Stop conversation
        function stopConversation() {
            if (socket) {
                socket.emit('stop_conversation');
            }
            stopListening();
            isConversationActive = false;
            updateStatus('Health assessment stopped', '');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }
        
        // Start listening for user input
        function startListening() {
            if (!audioStream || isRecording) return;
            
            try {
                updateStatus('🎤 Listening - Please speak now...', 'listening');
                document.getElementById('audioVisualizer').innerHTML = '<div class="recording-animation"></div>Recording your response...';
                
                const options = { mimeType: 'audio/webm;codecs=opus' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options.mimeType = 'audio/webm';
                }
                
                mediaRecorder = new MediaRecorder(audioStream, options);
                const audioChunks = [];
                
                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = function() {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    sendAudioToServer(audioBlob);
                };
                
                mediaRecorder.start();
                isRecording = true;
                
                setTimeout(() => {
                    if (isRecording) {
                        stopListening();
                    }
                }, 30000);
                
                setupVoiceActivityDetection();
                
            } catch (error) {
                console.error('Error starting recording:', error);
                showError('Failed to start recording. Please try again.');
            }
        }
        
        // Stop listening
        function stopListening() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                updateStatus('Processing speech...', 'processing');
                document.getElementById('audioVisualizer').innerHTML = '🔄 Processing audio...';
            }
        }
        
        // Voice Activity Detection
        function setupVoiceActivityDetection() {
            const audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(audioStream);
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            
            source.connect(analyser);
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            let silenceCount = 0;
            const maxSilenceCount = 10;
            let speechDetected = false;
            
            function checkAudioLevel() {
                if (!isRecording) return;
                
                analyser.getByteFrequencyData(dataArray);
                const average = dataArray.reduce((a, b) => a + b) / bufferLength;
                
                if (average > 20) {
                    speechDetected = true;
                    silenceCount = 0;
                } else if (speechDetected) {
                    silenceCount++;
                    if (silenceCount >= maxSilenceCount) {
                        stopListening();
                        return;
                    }
                }
                
                const intensity = Math.min(average / 50, 1);
                const bars = Math.floor(intensity * 15);
                document.getElementById('audioVisualizer').innerHTML = 
                    `<div class="recording-animation"></div>Recording... ${'█'.repeat(bars)}${'░'.repeat(15-bars)}`;
                
                setTimeout(checkAudioLevel, 100);
            }
            
            checkAudioLevel();
        }
        
        // Send audio to server
        function sendAudioToServer(audioBlob) {
            const reader = new FileReader();
            reader.onload = function() {
                const arrayBuffer = reader.result;
                const base64Audio = btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)));
                
                socket.emit('audio_data', {
                    audio: base64Audio,
                    encoding: 'WEBM_OPUS'
                });
            };
            reader.readAsArrayBuffer(audioBlob);
        }
        
        // Play TTS audio response
        function playTTSAudio(base64Audio, callback) {
            try {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                
                const audioBlob = base64ToBlob(base64Audio, 'audio/mp3');
                const audioUrl = URL.createObjectURL(audioBlob);
                currentAudio = new Audio(audioUrl);
                
                currentAudio.onended = function() {
                    URL.revokeObjectURL(audioUrl);
                    if (callback) callback();
                };
                
                currentAudio.onerror = function(error) {
                    console.error('Audio playback error:', error);
                    if (callback) callback();
                };
                
                currentAudio.play();
                
            } catch (error) {
                console.error('Error playing TTS audio:', error);
                if (callback) callback();
            }
        }
        
        // Add user message to conversation
        function addUserMessage(text) {
            const conversationArea = document.getElementById('conversationArea');
            
            // Remove empty state
            const emptyState = conversationArea.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `
                <div class="message-bubble">
                    ${text}
                    <div class="message-time">${new Date().toLocaleTimeString()}</div>
                </div>
                <div class="message-avatar">👤</div>
            `;
            
            conversationArea.appendChild(messageDiv);
            conversationArea.scrollTop = conversationArea.scrollHeight;
            messageCount++;
        }
        
        // Add agent message to conversation
        function addAgentMessage(text) {
            const conversationArea = document.getElementById('conversationArea');
            
            // Remove typing indicator if present
            const typingIndicator = conversationArea.querySelector('.typing-message');
            if (typingIndicator) {
                typingIndicator.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message agent';
            messageDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-bubble">
                    ${text}
                    <div class="message-time">${new Date().toLocaleTimeString()}</div>
                </div>
            `;
            
            conversationArea.appendChild(messageDiv);
            conversationArea.scrollTop = conversationArea.scrollHeight;
            messageCount++;
        }
        
        // Show typing indicator
        function showTypingIndicator() {
            const conversationArea = document.getElementById('conversationArea');
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message agent typing-message';
            typingDiv.innerHTML = `
                <div class="message-avatar">🏥</div>
                <div class="message-bubble">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            
            conversationArea.appendChild(typingDiv);
            conversationArea.scrollTop = conversationArea.scrollHeight;
        }
        
        // Clear conversation
        function clearConversation() {
            const conversationArea = document.getElementById('conversationArea');
            conversationArea.innerHTML = '';
        }
        
        // Download transcript
        function downloadTranscript() {
            if (conversationTranscript.length === 0) {
                showError('No conversation to download yet.');
                return;
            }
            
            let transcriptText = 'Health Risk Assessment Conversation Transcript\n';
            transcriptText += '='.repeat(50) + '\n\n';
            transcriptText += `Date: ${new Date().toLocaleDateString()}\n`;
            transcriptText += `Time: ${new Date().toLocaleTimeString()}\n\n`;
            
            conversationTranscript.forEach((entry, index) => {
                const speaker = entry.type === 'user' ? 'Member' : 'Harmony';
                transcriptText += `[${entry.timestamp}] ${speaker}: ${entry.text}\n\n`;
            });
            
            const blob = new Blob([transcriptText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `health_assessment_${new Date().toISOString().slice(0, 10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        // Utility function to convert base64 to blob
        function base64ToBlob(base64, mimeType) {
            const byteCharacters = atob(base64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            return new Blob([byteArray], { type: mimeType });
        }
        
        // Update status display
        function updateStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `
                <div class="status-indicator"></div>
                <span>${message}</span>
            `;
            statusEl.className = `status ${type}`;
        }
        
        // Show error message
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeSocket();
            loadMembers();
        });
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
            }
            if (socket) {
                socket.disconnect();
            }
        });
        
        // Load members on page load
        async function loadMembers() {
            try {
                const response = await fetch('/api/members');
                membersData = await response.json();
                displayMembers();
            } catch (error) {
                console.error('Error loading members:', error);
                showError('Failed to load member list');
            }
        }
        
        // Display members in the table
        function displayMembers() {
            const membersTableBody = document.getElementById('membersTableBody');
            membersTableBody.innerHTML = '';
            
            membersData.forEach(member => {
                const memberRow = document.createElement('tr');
                memberRow.className = 'member-row';
                memberRow.onclick = () => selectMember(member);
                
                memberRow.innerHTML = `
                    <td class="member-name-cell">${member.first_name} ${member.last_name}</td>
                    <td class="member-id-cell">${member.member_id}</td>
                    <td class="member-dob-cell">${member.DOB}</td>
                    <td class="member-email-cell">${member.email}</td>
                    <td class="member-ssn-cell">${member.last4ssn}</td>
                `;
                
                membersTableBody.appendChild(memberRow);
            });
        }
        
        // Select a member
        function selectMember(member) {
            selectedMember = member;
            
            // Update UI
            document.querySelectorAll('.member-row').forEach(row => {
                row.classList.remove('selected');
            });
            event.target.closest('.member-row').classList.add('selected');
            
            // Show selected member info
            document.getElementById('selectedMemberName').textContent = `${member.first_name} ${member.last_name}`;
            document.getElementById('selectedMemberId').textContent = member.member_id;
            document.getElementById('selectedMemberInfo').classList.add('show');
            
            // Enable start button
            document.getElementById('startBtn').disabled = false;
            
            // Send selection to server
            if (socket) {
                socket.emit('select_member', { member_id: member.member_id });
            }
            
            updateStatus(`Member selected: ${member.first_name} ${member.last_name}`, 'ready');
        }
    </script>
</body>
</html>
